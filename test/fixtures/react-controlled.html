<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Controlled inputs (React 18)</title>
<style>
  body { font: 15px/1.4 system-ui, sans-serif; margin: 2rem; }
  label { display: block; margin: .6rem 0 .2rem; }
  .error { color: #b00020; font-size: 13px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>
<script>
  // Controlled form: the DOM value is whatever React state says it is.
  // Assigning input.value directly does not reach state, so the submit sees the old value.
  const h = React.createElement;
  function SignupForm() {
    const [email, setEmail] = React.useState('');
    const [plan, setPlan] = React.useState('free');
    const [touched, setTouched] = React.useState(false);
    const [updates, setUpdates] = React.useState(false);
    const [done, setDone] = React.useState(null);
    const invalid = touched && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email);
    const submit = (e) => {
      e.preventDefault();
      window.__result = { email, plan, updates };
      setDone(email);
    };
    return h('form', { onSubmit: submit, 'aria-label': 'Sign up' },
      h('h1', null, 'Create account'),
      h('label', { htmlFor: 'email' }, 'Email'),
      h('input', {
        id: 'email', type: 'email', value: email, placeholder: 'you@example.com',
        'aria-invalid': invalid ? 'true' : 'false', 'aria-describedby': 'email-err',
        onChange: (e) => setEmail(e.target.value), onBlur: () => setTouched(true)
      }),
      h('div', { id: 'email-err', className: 'error' }, invalid ? 'Enter a valid email address' : ''),
      h('label', { htmlFor: 'plan' }, 'Plan'),
      h('select', { id: 'plan', value: plan, onChange: (e) => setPlan(e.target.value) },
        h('option', { value: 'free' }, 'Free'),
        h('option', { value: 'team' }, 'Team'),
        h('option', { value: 'enterprise' }, 'Enterprise')),
      h('label', null, h('input', { type: 'checkbox', checked: updates, onChange: (e) => setUpdates(e.target.checked) }), ' Send me product updates'),
      h('p', null, h('button', { type: 'submit' }, 'Sign up')),
      done ? h('p', { role: 'status' }, 'Signed up as ' + done) : null
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(SignupForm));
</script>
</body>
</html>
